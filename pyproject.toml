[project]
name = "eyesonqa"
version = "0.1.0"
description = "Eyes-On QA: a phone-run multi-agent coding team that proves its work on video before anything merges."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "openai>=1.50",
  "playwright>=1.64",
  "pillow>=10.4",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
]

[project.scripts]
eyesonqa = "eyesonqa.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eyesonqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
